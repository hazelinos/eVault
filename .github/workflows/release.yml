name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evault-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create or use stable signing key
        shell: bash
        run: |
          test -s signing/evault-debug.jks || { echo 'Stable signing key is missing'; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify release version
        shell: bash
        run: |
          grep -q 'versionCode = 33' app/build.gradle.kts
          grep -q 'versionName = "1.4.1"' app/build.gradle.kts
          echo 'Version verified: 1.4.1 (33)'

      - name: Build installable APK
        run: gradle assembleDebug lintDebug --stacktrace

      - name: Rename APK
        run: |
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)
          test -n "$apk"
          cp "$apk" eVault-v1.4.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eVault-v1.4.1
          path: eVault-v1.4.1.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<'EOF'
          eVault v1.4.1 — pembaruan tampilan.
          
          - Desain Figma: tema terang dengan aksen lime, kartu akun terpilih, dan tombol membulat.
          - Halaman Pengaturan terpisah, status verifikasi di library, dan ringkasan progres Auto Login.
          - Fungsi AUTH, clone selection, dan Auto Login tetap dipertahankan.
          - Kompatibilitas warna navigation bar untuk Android 8.0 dan yang lebih baru.
          
          APK memakai application ID dan signing key yang sama dengan versi sebelumnya.
          EOF
          )
          if gh release view v1.4.1 >/dev/null 2>&1; then
            gh release edit v1.4.1 --title "eVault v1.4.1" --notes "$NOTES" --latest
          else
            gh release create v1.4.1 --target "${{ github.sha }}" --title "eVault v1.4.1" --notes "$NOTES" --latest
          fi
          gh release upload v1.4.1 eVault-v1.4.1.apk --clobber
