name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Verify release version
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          s=open('app/build.gradle.kts').read()
          code=re.search(r'versionCode\s*=\s*(\d+)', s).group(1)
          name=re.search(r'versionName\s*=\s*"([^"]+)"', s).group(1)
          assert code == '3', f'Expected versionCode 3, got {code}'
          assert name == '1.1.0', f'Expected versionName 1.1.0, got {name}'
          print(f'Version verified: {name} ({code})')
          PY

      - name: Build installable APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)
          test -n "$apk"
          cp "$apk" eVault-v1.1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eVault-v1.1.0
          path: eVault-v1.1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: eVault v1.1.0
          generate_release_notes: true
          files: eVault-v1.1.0.apk
