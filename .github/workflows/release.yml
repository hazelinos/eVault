name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          latest=$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+$' | sed 's/^v//' | sort -n | tail -n1)
          if [ -z "$latest" ]; then
            release_number=1
          else
            release_number=$((latest + 1))
          fi
          echo "release_number=$release_number" >> "$GITHUB_OUTPUT"
          echo "version_code=$release_number" >> "$GITHUB_OUTPUT"
          echo "version_name=${release_number}.0.0" >> "$GITHUB_OUTPUT"

      - name: Update Android version
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          python3 - <<'PY'
          import os, re
          p='app/build.gradle.kts'
          s=open(p).read()
          s=re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {os.environ["VERSION_CODE"]}', s)
          s=re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{os.environ["VERSION_NAME"]}"', s)
          open(p,'w').write(s)
          PY

      - name: Build installable APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)
          if [ -z "$apk" ]; then
            echo 'No APK found' >&2
            find app/build/outputs -type f -maxdepth 5 -print >&2 || true
            exit 1
          fi
          cp "$apk" "eVault-v${{ steps.version.outputs.release_number }}.apk"
          echo "path=eVault-v${{ steps.version.outputs.release_number }}.apk" >> "$GITHUB_OUTPUT"
          echo "Found APK: $apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eVault-v${{ steps.version.outputs.release_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Commit version bump
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle.kts
          git diff --cached --quiet || git commit -m "chore: release v${{ steps.version.outputs.release_number }}"
          git push

      - name: Remove legacy releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in v1.0.0 v1.0.1 v1.0.2; do
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.release_number }}
          name: eVault v${{ steps.version.outputs.release_number }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
