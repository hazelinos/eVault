name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create or use stable signing key
        shell: bash
        run: |
          if [ ! -s signing/evault-debug.jks ]; then
            echo "Generating new signing key..."
            mkdir -p signing
            keytool -genkeypair \
              -keystore signing/evault-debug.jks \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug, OU=Android, O=Android, L=US, ST=California, C=US'
            
            # Commit key to repo for future builds
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add signing/evault-debug.jks
            git commit -m "chore: add stable signing key for consistent APK signatures"
            git push
          else
            echo "Using existing signing key from repo"
          fi
          test -s signing/evault-debug.jks

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Verify release version
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          s=open('app/build.gradle.kts').read()
          code=re.search(r'versionCode\s*=\s*(\d+)', s).group(1)
          name=re.search(r'versionName\s*=\s*"([^"]+)"', s).group(1)
          assert code == '11', f'Expected versionCode 11, got {code}'
          assert name == '1.1.9', f'Expected versionName 1.1.9, got {name}'
          print(f'Version verified: {name} ({code})')
          PY

      - name: Build installable APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)
          test -n "$apk"
          cp "$apk" eVault-v1.1.9.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eVault-v1.1.9
          path: eVault-v1.1.9.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.9
          name: eVault v1.1.9
          generate_release_notes: true
          make_latest: true
          files: eVault-v1.1.9.apk
