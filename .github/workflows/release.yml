name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evault-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create or use stable signing key
        shell: bash
        run: |
          test -s signing/evault-debug.jks || { echo 'Stable signing key is missing'; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Verify release version
        shell: bash
        run: |
          grep -q 'versionCode = 27' app/build.gradle.kts
          grep -q 'versionName = "1.3.5"' app/build.gradle.kts
          echo 'Version verified: 1.3.5 (27)'

      - name: Build installable APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)
          test -n "$apk"
          cp "$apk" eVault-v1.3.5.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eVault-v1.3.5
          path: eVault-v1.3.5.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<'EOF'
          Stability & data-safety release.

          - Atomic AUTH install: replace in place instead of delete-then-rename, so a
            failed copy can never leave eFootball without an AUTH file
          - Create-account workflow now backs up the installed AUTH and restores it on cancel
          - Safer SAF handling: null-safe directory listing, revoked-permission detection,
            and clearer feedback when a provider does not support persistent access
          - Stricter input validation for category/account names
          - Webhook: stricter URL validation, real JSON parsing of the message id,
            404 recovery, bounded request queue, and session-generation guard
          - Fixed broken drawable namespaces and added Android 15 edge-to-edge insets
          - Activity log writes are now thread-safe; selection survives rotation
          EOF
          )
          if gh release view v1.3.5 >/dev/null 2>&1; then
            gh release edit v1.3.5 --title "eVault v1.3.5" --notes "$NOTES" --latest
          else
            gh release create v1.3.5 --title "eVault v1.3.5" --notes "$NOTES" --latest
          fi
          gh release upload v1.3.5 eVault-v1.3.5.apk --clobber
