name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          if [ -z "$latest" ]; then
            version_code=1
            version_name=1.0.0
          else
            old=${latest#v}
            IFS='.' read -r major minor patch <<< "$old"
            version_code=$((patch + 1))
            version_name="$major.$minor.$((patch + 1))"
          fi
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Update Android version
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          python3 - <<'PY'
          import os, re
          p='app/build.gradle.kts'
          s=open(p).read()
          s=re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {os.environ["VERSION_CODE"]}', s)
          s=re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{os.environ["VERSION_NAME"]}"', s)
          open(p,'w').write(s)
          PY

      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Commit version bump
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle.kts
          git diff --cached --quiet || git commit -m "chore: release v${{ steps.version.outputs.version_name }}"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: eVault v${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
