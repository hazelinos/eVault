name: Android UI check

on:
  pull_request:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/android-ui-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and lint Android app
        run: gradle assembleDebug lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: eVault-ui-preview
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  device-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native layout and navigation checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle connectedDebugAndroidTest --stacktrace
            mkdir -p ui-screenshots/normal
            adb pull /data/local/tmp/evault-ui ui-screenshots/normal
            test -s ui-screenshots/normal/evault-ui/home.png
            test -s ui-screenshots/normal/evault-ui/settings.png
            test -s ui-screenshots/normal/evault-ui/setup.png
            adb shell settings put system font_scale 1.3
            gradle connectedDebugAndroidTest --rerun-tasks --stacktrace
            mkdir -p ui-screenshots/large-text
            adb pull /data/local/tmp/evault-ui ui-screenshots/large-text
            test -s ui-screenshots/large-text/evault-ui/home.png
      - name: Upload UI evidence and device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evault-native-ui-evidence
          path: |
            ui-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
